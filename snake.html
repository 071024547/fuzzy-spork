<!DOCTYPE html>
 <html lang="zh-CN">
 <head>
     <meta charset="UTF-8">
     <title>贪吃蛇完整作业（手动+AI自动）</title>
     <style>
         body{text-align:center;font-family:"Microsoft Yahei";background:#f6f8fa;}
         #gameCanvas{border:3px solid #222;background:#fff;}
         .box{margin:10px auto;}
         .info{font-size:18px;margin:8px;}
         button{
             font-size:16px;
             padding:6px 18px;
             margin:5px;
             border:none;
             border-radius:6px;
             background:#2493ff;
             color:#fff;
             cursor:pointer;
         }
         button:hover{opacity:0.9;}
     </style>
 </head>
 <body>
     <h2>贪吃蛇游戏 | 手动游玩 + AI自动游玩</h2>
     <div class="info">
         当前分数：<span id="score">0</span>
         &nbsp;&nbsp;最高分：<span id="highScore">0</span>
         &nbsp;&nbsp;AI吃到食物数：<span id="aiCount">0</span>/15
     </div>
     <div class="box">
         <button id="aiBtn">开启AI自动模式</button>
         <button id="resetBtn">重置游戏</button>
     </div>
     <canvas id="gameCanvas" width="400" height="400"></canvas>
     <p>方向键手动控制｜开启AI后自动吃食物、避撞墙和自身</p >
     <script>
         const canvas = document.getElementById('gameCanvas');
         const ctx = canvas.getContext('2d');
         const scoreDom = document.getElementById('score');
         const highScoreDom = document.getElementById('highScore');
         const aiCountDom = document.getElementById('aiCount');
         const resetBtn = document.getElementById('resetBtn');
         const aiBtn = document.getElementById('aiBtn');
         const grid = 20;
         let snake = [{x:10*grid, y:10*grid}];
         let food = {};
         let dx = grid, dy = 0;
         let score = 0;
         let highScore = Number(localStorage.getItem('snakeHigh')) || 0;
         highScoreDom.innerText = highScore;
         let gameOver = false;
         let aiOpen = false;
         let aiEatNum = 0;
         // 生成食物（不生成在蛇身上）
         function spawnFood(){
             food.x = Math.floor(Math.random() * 20) * grid;
             food.y = Math.floor(Math.random() * 20) * grid;
             for(let seg of snake){
                 if(seg.x === food.x && seg.y === food.y) spawnFood();
             }
         }
         // 绘制画面
         function draw(){
             ctx.clearRect(0,0,canvas.width,canvas.height);
             // 蛇身
             ctx.fillStyle="#27ae60";
             snake.forEach(seg=>{
                 ctx.fillRect(seg.x, seg.y, grid-1, grid-1);
             })
             // 食物
             ctx.fillStyle="#e74c3c";
             ctx.fillRect(food.x, food.y, grid-1, grid-1);
         }
         // 碰撞检测：某个坐标是否危险（墙/自己）
         function isSafe(x,y){
             // 撞墙
             if(x<0 || x>=canvas.width || y<0 || y>=canvas.height) return false;
             // 撞自己
             for(let seg of snake) if(seg.x===x&&seg.y===y) return false;
             return true;
         }
         // AI自动寻路逻辑
         function aiMove(){
             let head = snake[0];
             let dirList = [];
             // 优先朝向食物
             if(food.x > head.x) dirList.push({dx:grid, dy:0});
             if(food.x < head.x) dirList.push({dx:-grid, dy:0});
             if(food.y > head.y) dirList.push({dx:0, dy:grid});
             if(food.y < head.y) dirList.push({dx:0, dy:-grid});
             // 兜底四个方向（防止卡死）
             dirList.push({dx:grid, dy:0});
             dirList.push({dx:-grid, dy:0});
             dirList.push({dx:0, dy:grid});
             dirList.push({dx:0, dy:-grid});
             // 筛选安全方向
             for(let d of dirList){
                 let nx = head.x + d.dx;
                 let ny = head.y + d.dy;
                 if(isSafe(nx, ny)){
                     dx = d.dx;
                     dy = d.dy;
                     return;
                 }
             }
         }
         // 游戏更新逻辑
         function update(){
             if(gameOver) return;
             // AI开启则自动控方向
             if(aiOpen) aiMove();
             let head = {x: snake[0].x + dx, y: snake[0].y + dy};
             // 撞墙
             if(!isSafe(head.x, head.y)){
                 gameOver = true;
                 alert("游戏结束！得分："+score+"，AI吃到："+aiEatNum+"个");
                 return;
             }
             snake.unshift(head);
             // 吃到食物
             if(head.x === food.x && head.y === food.y){
                 score += 10;
                 scoreDom.innerText = score;
                 // AI计数
                 if(aiOpen){
                     aiEatNum++;
                     aiCountDom.innerText = aiEatNum;
                 }
                 // 更新最高分
                 if(score > highScore){
                     highScore = score;
                     highScoreDom.innerText = highScore;
                     localStorage.setItem('snakeHigh', highScore);
                 }
                 spawnFood();
             }else{
                 snake.pop();
             }
         }
         // 键盘手动控制
         document.addEventListener('keydown',e=>{
             if(gameOver) return;
             if(e.key==="ArrowUp" && dy===0){dx=0; dy=-grid;}
             if(e.key==="ArrowDown" && dy===0){dx=0; dy=grid;}
             if(e.key==="ArrowLeft" && dx===0){dx=-grid; dy=0;}
             if(e.key==="ArrowRight" && dx===0){dx=grid; dy=0;}
         })
         // 重置游戏
         function resetGame(){
             snake = [{x:10*grid, y:10*grid}];
             dx = grid; dy = 0;
             score = 0;
             aiEatNum = 0;
             aiOpen = false;
             gameOver = false;
             scoreDom.innerText = 0;
             aiCountDom.innerText = 0;
             aiBtn.innerText = "开启AI自动模式";
             spawnFood();
         }
         // AI开关
         aiBtn.onclick = function(){
             aiOpen = !aiOpen;
             if(aiOpen){
                 aiBtn.innerText = "关闭AI自动模式";
             }else{
                 aiBtn.innerText = "开启AI自动模式";
             }
         }
         resetBtn.onclick = resetGame;
         // 游戏循环
         function loop(){
             update();
             draw();
             setTimeout(loop,110);
         }
         spawnFood();
         loop();
     </script>
 </body>
 </html>
